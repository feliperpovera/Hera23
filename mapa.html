<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hera23 — Dónde están las casas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html,body{height:100%;margin:0}
  #map{height:100%;width:100%;background:#e8e8e2}
  .leaflet-popup-content{font-family:'Manrope','Helvetica Neue',sans-serif;color:#202720;font-size:13px;line-height:1.6}
  .leaflet-popup-content b{display:block;font-size:14px;letter-spacing:.04em}
  .etq{background:#fdfcf9;border:1px solid #d5a447;border-radius:12px;color:#202720;font-family:'Manrope','Helvetica Neue',sans-serif;font-size:12px;line-height:1.45;padding:7px 11px;box-shadow:0 4px 14px rgba(32,39,32,.18);white-space:nowrap}
  .etq b{font-weight:500;letter-spacing:.05em}
  .etq::before{border-right-color:#d5a447}
</style>
</head>
<body>
<div id="map"></div>
<script>
const q = new URLSearchParams(location.search);
const map = L.map('map', { scrollWheelZoom: false });
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors' }).addTo(map);
const gold = '#d5a447', dark = '#202720';
if (q.get('lat')) {
  const lat = +q.get('lat'), lng = +q.get('lng');
  map.setView([lat, lng], +(q.get('zoom') || 14));
  const c = L.circle([lat, lng], { radius: 600, color: gold, weight: 2, fillColor: gold, fillOpacity: 0.22 }).addTo(map);
  if (q.get('label')) c.bindPopup(q.get('label')).openPopup();
} else {
  // Dos destinos reales, tres casas
  const destinos = [
    { nombre: 'Medellín', casas: 'Casa Grande · Villa Medellín', lat: 6.2442, lng: -75.5812, radio: 6000 },
    { nombre: 'Santa Fe de Antioquia', casas: 'Villa Santa Fe', lat: 6.5563, lng: -75.8276, radio: 4000 },
    { nombre: 'Venecia', casas: 'Finca Campestre', lat: 5.9636, lng: -75.7370, radio: 4000 }
  ];
  destinos.forEach(d => {
    L.circleMarker([d.lat, d.lng], { radius: 11, color: dark, weight: 2.5, fillColor: gold, fillOpacity: 0.95 })
      .addTo(map)
      .bindTooltip('<b>' + d.nombre + '</b><br>' + d.casas, { permanent: true, direction: 'right', offset: [14, 0], className: 'etq' })
      .bindPopup('<b>' + d.nombre + '</b>' + d.casas);
  });
  map.fitBounds(L.latLngBounds(destinos.map(d => [d.lat, d.lng])), { padding: [46, 46], maxZoom: 10 });
}
</script>
</body>
</html>
